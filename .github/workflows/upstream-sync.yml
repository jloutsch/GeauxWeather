# When tunefriend/GeauxWeather publishes a new release, merge it into this fork:
#  - clean merge  → push sync/upstream-<tag>, open a PR into main, start CI on it.
#                   CI failing on that PR means upstream broke one of this fork's features.
#  - conflicts    → open an issue listing the conflicting files (resolve by hand).
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Upstream sync

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write # push the sync branch
  pull-requests: write # open the sync PR
  issues: write # report merge conflicts
  actions: write # start CI on the sync branch

concurrency:
  group: upstream-sync

env:
  UPSTREAM: tunefriend/GeauxWeather

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the latest upstream release
        run: |
          set -euo pipefail
          tag=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/upstream-$tag"

          if git merge-base --is-ancestor "upstream-$tag" HEAD; then
            echo "main already contains upstream $tag; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          branch="sync/upstream-$tag"
          git switch -c "$branch"

          if git merge --no-edit -m "Merge upstream $tag" "upstream-$tag"; then
            git push --force origin "$branch"
            if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
              gh pr create --base main --head "$branch" \
                --title "Sync upstream $tag" \
                --body "Merges upstream release [$tag](https://github.com/$UPSTREAM/releases/tag/$tag) into this fork. CI runs on this branch; a failure means upstream changed something one of this fork's features or tests depend on."
            fi
            gh workflow run ci.yml --ref "$branch"
          else
            # Backticks here and in the issue body are literal Markdown.
            # shellcheck disable=SC2016
            conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort
            title="Upstream $tag merge conflict"
            if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
              # shellcheck disable=SC2016
              gh issue create --title "$title" --body "$(printf 'Upstream release [%s](https://github.com/%s/releases/tag/%s) does not merge cleanly into `main`.\n\nConflicting files:\n%s\n\nResolve locally:\n```\ngit fetch https://github.com/%s.git refs/tags/%s\ngit switch -c sync/upstream-%s main\ngit merge FETCH_HEAD\n# fix conflicts, run npm test and ./gradlew testDebugUnitTest, then open a PR\n```' "$tag" "$UPSTREAM" "$tag" "$conflicts" "$UPSTREAM" "$tag" "$tag")"
            fi
          fi
