# Guards this fork's features (clock widget, alerts, precipitation notification, night
# icons, …): runs every JS and Android test, lint, and a debug build on each change,
# including the upstream-sync PRs opened by upstream-sync.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # upstream-sync.yml starts this on its branch (PRs it opens don't trigger pull_request)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Socket Firewall screens every package install; bootstrapping it is the one plain npm call.
      - name: Install Socket Firewall
        run: npm install -g sfw@2.0.4

      - name: Install dependencies
        run: sfw npm ci

      - name: JS tests
        run: sfw npm test

      - name: Sync web assets into the Android project
        run: sfw npx cap sync android

      - name: Android unit tests, lint, debug build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
